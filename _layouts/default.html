<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --surface: rgba(30, 41, 59, 0.55);
      --border: rgba(147, 197, 253, 0.25);
      --text: #f1f5f9;
      --muted: #cbd5e1;
      --pastel-blue: #93c5fd;
      --pastel-cyan: #a5f3fc;
      --pastel-lavender: #c4b5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(147, 197, 253, 0.18), transparent 40%),
        radial-gradient(circle at 90% 25%, rgba(196, 181, 253, 0.15), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(165, 243, 252, 0.12), transparent 45%);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.7;
      min-height: 100vh;
    }

    .container {
      max-width: 940px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem 5rem;
    }

    /* Soft Pill Navigation */
    nav {
      position: sticky;
      top: 1.25rem;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.75rem;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 999px;
      margin-bottom: 4rem;
      box-shadow: 0 8px 32px rgba(147, 197, 253, 0.08);
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--pastel-blue);
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .nav-links { display: flex; gap: 1.5rem; flex-wrap: wrap; }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--pastel-cyan);
      text-shadow: 0 0 12px rgba(165, 243, 252, 0.5);
    }

    /* Typography */
    h1 {
      font-size: 2.85rem;
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.02em;
      margin-bottom: 1.1rem;
      background: linear-gradient(120deg, #ffffff, var(--pastel-blue), var(--pastel-cyan), var(--pastel-lavender));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--pastel-blue);
      margin: 4rem 0 1.25rem;
      padding-top: 0.5rem;
      scroll-margin-top: 6rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    h2::before {
      content: "✦";
      color: var(--pastel-lavender);
      font-size: 1rem;
    }

    p { color: var(--muted); margin-bottom: 1.4rem; font-size: 1.05rem; }

    a { color: var(--pastel-blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Soft Rounded Frosted Cards */
    ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.35rem;
      list-style: none;
      margin-top: 1rem;
    }

    li {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.65), rgba(15, 23, 42, 0.5));
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 1.75rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    li:hover {
      transform: translateY(-4px);
      border-color: rgba(165, 243, 252, 0.55);
      box-shadow: 0 12px 32px rgba(147, 197, 253, 0.16);
    }

    li strong {
      display: block;
      font-size: 1.15rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    /* Soft Pill Skill Badges */
    code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      background: rgba(147, 197, 253, 0.12);
      color: var(--pastel-cyan);
      border: 1px solid rgba(147, 197, 253, 0.28);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      display: inline-block;
      margin: 0.25rem 0.3rem 0.25rem 0;
    }

    /* Pastel Gradient Pill Buttons */
    .btn {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0b1120;
      background: linear-gradient(135deg, var(--pastel-blue), var(--pastel-cyan));
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(147, 197, 253, 0.35);
      transition: 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(165, 243, 252, 0.55);
      text-decoration: none;
    }

    .btn-outline {
      display: inline-block;
      margin-top: 0.5rem;
      margin-left: 0.75rem;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--pastel-blue);
      background: rgba(147, 197, 253, 0.08);
      border: 1px solid rgba(147, 197, 253, 0.4);
      border-radius: 999px;
      text-decoration: none;
      transition: 0.25s ease;
    }

    .btn-outline:hover {
      background: rgba(147, 197, 253, 0.18);
      border-color: var(--pastel-cyan);
      text-decoration: none;
    }

    li img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="#top" class="logo">&lt;portfolio /&gt;</a>
      <div class="nav-links">
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
    <main id="top">
      {{ content }}
    </main>
  </div>
</body>
</html>
