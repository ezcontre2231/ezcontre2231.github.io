<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f8ff;
      --surface: rgba(255, 255, 255, 0.72);
      --border: rgba(147, 197, 253, 0.45);
      --text: #0f172a;
      --muted: #475569;
      --blue-primary: #2563eb;
      --pastel-blue: #60a5fa;
      --pastel-cyan: #67e8f9;
      --pastel-lavender: #a78bfa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 12% 10%, rgba(147, 197, 253, 0.42), transparent 42%),
        radial-gradient(circle at 88% 22%, rgba(196, 181, 253, 0.35), transparent 42%),
        radial-gradient(circle at 50% 88%, rgba(165, 243, 252, 0.38), transparent 48%);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.7;
      min-height: 100vh;
    }

    .container {
      max-width: 940px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem 5rem;
    }

    /* Soft Frosted Pill Navigation */
    nav {
      position: sticky;
      top: 1.25rem;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.75rem;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      margin-bottom: 4rem;
      box-shadow: 0 8px 30px rgba(96, 165, 250, 0.14);
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--blue-primary);
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .nav-links { display: flex; gap: 1.5rem; flex-wrap: wrap; }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--blue-primary);
    }

    /* Typography */
    h1 {
      font-size: 2.85rem;
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.02em;
      margin-bottom: 1.1rem;
      background: linear-gradient(120deg, #0f172a, #2563eb, #0891b2, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--blue-primary);
      margin: 4rem 0 1.25rem;
      padding-top: 0.5rem;
      scroll-margin-top: 6rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    h2::before {
      content: "✦";
      color: var(--pastel-lavender);
      font-size: 1rem;
    }

    p { color: var(--muted); margin-bottom: 1.4rem; font-size: 1.05rem; }

    a { color: var(--blue-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Soft White Glass Cards */
    ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.35rem;
      list-style: none;
      margin-top: 1rem;
    }

    li {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.85), rgba(240, 249, 255, 0.65));
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 22px;
      padding: 1.75rem;
      box-shadow: 0 6px 24px rgba(147, 197, 253, 0.16);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    li:hover {
      transform: translateY(-4px);
      border-color: var(--pastel-blue);
      box-shadow: 0 14px 32px rgba(96, 165, 250, 0.24);
    }

    li strong {
      display: block;
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    /* Soft Pill Skill Badges */
    code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      background: rgba(219, 234, 254, 0.75);
      color: #1d4ed8;
      border: 1px solid rgba(147, 197, 253, 0.6);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      display: inline-block;
      margin: 0.25rem 0.3rem 0.25rem 0;
    }

    /* Pastel Gradient Pill Buttons */
    .btn {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.28);
      transition: 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(6, 182, 212, 0.4);
      text-decoration: none;
    }

    .btn-outline {
      display: inline-block;
      margin-top: 0.5rem;
      margin-left: 0.75rem;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--blue-primary);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(147, 197, 253, 0.7);
      border-radius: 999px;
      text-decoration: none;
      transition: 0.25s ease;
    }

    .btn-outline:hover {
      background: #ffffff;
      border-color: var(--pastel-blue);
      box-shadow: 0 4px 16px rgba(147, 197, 253, 0.25);
      text-decoration: none;
    }

    li img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="#top" class="logo">&lt;portfolio /&gt;</a>
      <div class="nav-links">
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
    <main id="top">
      {{ content }}
    </main>
  </div>
</body>
</html>
